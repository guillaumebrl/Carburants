<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prix Carburants · France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f4f0;--surface:#ffffff;--surface2:#f0efeb;--border:#e0ddd6;
    --text:#1a1a18;--muted:#888;--accent:#b8860b;--accent2:#0f7c68;--danger:#c0392b;
    --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  }
  body{font-family:var(--font);background:var(--bg);color:var(--text);height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-icon{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .brand h1{font-size:14px;font-weight:500;letter-spacing:-.02em}
  .brand span{font-size:10px;color:var(--muted);font-family:var(--mono)}
  .controls{display:flex;gap:5px;flex-wrap:wrap}
  .fuel-btn{font-family:var(--mono);font-size:11px;font-weight:500;padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
  .fuel-btn:hover{border-color:var(--accent);color:var(--accent)}
  .fuel-btn.active{background:var(--accent);color:#0f0f0f;border-color:var(--accent)}
  .status-bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s;flex-shrink:0}
  .dot.loading{background:var(--accent);animation:pulse 1s infinite}
  .dot.ok{background:var(--accent2)}
  .dot.error{background:var(--danger)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .map-wrapper{position:relative;overflow:hidden}
  #map{width:100%;height:100%;background:#f5f4f0}
  .leaflet-container{background:#f5f4f0}
  .legend{position:absolute;bottom:24px;left:16px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:150px}
  .legend-title{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
  .legend-bar{height:7px;border-radius:4px;background:linear-gradient(to right,#2196f3,#4caf50,#ffeb3b,#ff9800,#f44336);margin-bottom:6px}
  .legend-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .stats-panel{position:absolute;top:16px;right:16px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:165px}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
  .stat-row+.stat-row{border-top:1px solid var(--border)}
  .stat-label{color:var(--muted);font-size:11px}
  .stat-val{font-family:var(--mono);font-size:13px;font-weight:500}
  .stat-val.low{color:var(--accent2)}.stat-val.mid{color:var(--accent)}.stat-val.high{color:var(--danger)}
  .leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:10px!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;font-family:var(--mono)!important;font-size:11px!important}
  .leaflet-popup-content{margin:12px 16px!important}
  .leaflet-popup-tip{background:var(--surface)!important}
  .leaflet-popup-close-button{color:var(--muted)!important}
  .popup-price{font-size:20px;font-weight:500;color:var(--accent);margin-bottom:8px}
  .popup-label{color:var(--muted);font-size:10px;margin-bottom:1px;margin-top:6px}
  .popup-val{color:var(--text)}
  .overlay-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2000;text-align:center;pointer-events:none}
  .overlay-msg p{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .search-wrap{position:relative;display:flex;align-items:center}
  .search-input{font-family:var(--mono);font-size:12px;padding:5px 32px 5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);width:180px;outline:none;transition:border-color .15s}
  .search-input::placeholder{color:var(--muted)}
  .search-input:focus{border-color:var(--accent)}
  .search-btn{position:absolute;right:8px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:0;line-height:1;transition:color .15s}
  .search-btn:hover{color:var(--accent)}
  .search-suggestions{position:absolute;top:calc(100% + 4px);left:0;width:260px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.1);z-index:9999;overflow:hidden;display:none}
  .search-suggestions.show{display:block}
  .suggestion-item{padding:8px 14px;font-size:12px;font-family:var(--mono);cursor:pointer;color:var(--text);transition:background .1s}
  .suggestion-item:hover{background:var(--surface2)}
  .suggestion-item+.suggestion-item{border-top:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon">⛽</div>
    <div>
      <h1>Prix Carburants</h1>
      <span id="data-date">données · France</span>
    </div>
  </div>
  <div class="controls" id="fuel-buttons">
    <button class="fuel-btn active" data-fuel="Gazole">Gazole</button>
    <button class="fuel-btn" data-fuel="SP95">SP95</button>
    <button class="fuel-btn" data-fuel="E10">E10</button>
    <button class="fuel-btn" data-fuel="SP98">SP98</button>
    <button class="fuel-btn" data-fuel="GPLc">GPLc</button>
    <button class="fuel-btn" data-fuel="E85">E85</button>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="search-input" type="text" placeholder="Rechercher une ville…" autocomplete="off">
    <button class="search-btn" id="search-btn">⌕</button>
    <div class="search-suggestions" id="search-suggestions"></div>
  </div>
  <div class="status-bar">
    <div class="dot loading" id="status-dot"></div>
    <span id="status-text">Chargement…</span>
  </div>
</header>

<div class="map-wrapper">
  <div id="map"></div>

  <div class="overlay-msg" id="loading-overlay">
    <div class="spinner"></div>
    <p>Lecture des données…</p>
  </div>

  <div class="legend" id="legend" style="display:none">
    <div class="legend-title">Prix (€/L)</div>
    <div class="legend-bar"></div>
    <div class="legend-labels">
      <span id="leg-min">—</span>
      <span id="leg-mid">—</span>
      <span id="leg-max">—</span>
    </div>
  </div>

  <div class="stats-panel" id="stats-panel" style="display:none">
    <div class="stat-row"><span class="stat-label">Stations</span><span class="stat-val mid" id="st-count">—</span></div>
    <div class="stat-row"><span class="stat-label">Min</span><span class="stat-val low" id="st-min">—</span></div>
    <div class="stat-row"><span class="stat-label">Moyenne</span><span class="stat-val mid" id="st-avg">—</span></div>
    <div class="stat-row"><span class="stat-label">Max</span><span class="stat-val high" id="st-max">—</span></div>
    <div class="stat-row"><span class="stat-label">Fichier</span><span class="stat-val" id="st-date" style="font-size:10px;color:var(--muted)">—</span></div>
  </div>
</div>

<script>
const COLOR_SCALE = [
  [0.00,[33,150,243]],[0.25,[76,175,80]],[0.55,[255,235,59]],[0.80,[255,152,0]],[1.00,[244,67,54]]
];
function lerp(a,b,t){return a+(b-a)*t}
function colorAt(t){
  t=Math.max(0,Math.min(1,t));
  let i=0;
  while(i<COLOR_SCALE.length-2&&COLOR_SCALE[i+1][0]<=t)i++;
  const[t0,c0]=COLOR_SCALE[i],[t1,c1]=COLOR_SCALE[i+1],f=(t-t0)/(t1-t0);
  return `rgb(${Math.round(lerp(c0[0],c1[0],f))},${Math.round(lerp(c0[1],c1[1],f))},${Math.round(lerp(c0[2],c1[2],f))})`;
}

const map = L.map('map',{zoomControl:false}).setView([49.415,2.8236],12);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO',maxZoom:19
}).addTo(map);

let allData=[], markerLayer=L.layerGroup().addTo(map), currentFuel='Gazole';

function setStatus(state,text){
  document.getElementById('status-dot').className='dot '+state;
  document.getElementById('status-text').textContent=text;
}

async function unzip(buffer){
  const arr=new Uint8Array(buffer);
  let off=0;
  while(off<arr.length-30){
    if(arr[off]===0x50&&arr[off+1]===0x4b&&arr[off+2]===0x03&&arr[off+3]===0x04)break;
    off++;
  }
  const comp=(arr[off+8])|(arr[off+9]<<8);
  const compSize=(arr[off+18])|(arr[off+19]<<8)|(arr[off+20]<<16)|(arr[off+21]<<24);
  const fnLen=(arr[off+26])|(arr[off+27]<<8);
  const exLen=(arr[off+28])|(arr[off+29]<<8);
  const dataOff=off+30+fnLen+exLen;
  const compressed=arr.slice(dataOff,dataOff+compSize);
  if(comp===0)return compressed;
  const ds=new DecompressionStream('deflate-raw');
  const w=ds.writable.getWriter();w.write(compressed);w.close();
  const chunks=[],r=ds.readable.getReader();
  while(true){const{done,value}=await r.read();if(done)break;chunks.push(value);}
  let total=0;chunks.forEach(c=>total+=c.length);
  const out=new Uint8Array(total);let pos=0;
  chunks.forEach(c=>{out.set(c,pos);pos+=c.length;});
  return out;
}

function parseXML(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,'text/xml');
  const rows=[];
  doc.querySelectorAll('pdv').forEach(pdv=>{
    const lat=parseFloat(pdv.getAttribute('latitude'))/100000;
    const lon=parseFloat(pdv.getAttribute('longitude'))/100000;
    if(isNaN(lat)||isNaN(lon))return;
    const adresse=pdv.querySelector('adresse')?.textContent||'';
    const ville=pdv.querySelector('ville')?.textContent||'';
    const cp=pdv.getAttribute('cp')||'';
    pdv.querySelectorAll('prix').forEach(p=>{
      const nom=p.getAttribute('nom');
      const val=parseFloat(p.getAttribute('valeur'));
      if(nom&&!isNaN(val)&&val>0)
        rows.push({lat,lon,adresse,ville,cp,carb:nom,prix:val,maj:p.getAttribute('maj')||''});
    });
  });
  return rows;
}

async function loadData(){
  setStatus('loading','Chargement…');
  try {
    const resp = await fetch('data.zip');
    if (!resp.ok) throw new Error('data.zip introuvable (HTTP '+resp.status+')');

    // Récupère la date de dernière modification depuis les headers HTTP
    const lastMod = resp.headers.get('last-modified');
    if (lastMod) {
      const d = new Date(lastMod);
      document.getElementById('data-date').textContent =
        'données du ' + d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})
        + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    }

    const buf = await resp.arrayBuffer();
    const bytes = await unzip(buf);
    const xml = new TextDecoder('iso-8859-1').decode(bytes);
    allData = parseXML(xml);

    document.getElementById('loading-overlay').style.display='none';
    setStatus('ok', allData.length.toLocaleString('fr')+' entrées');
    renderFuel(currentFuel);
  } catch(e) {
    document.getElementById('loading-overlay').style.display='none';
    setStatus('error', e.message);
  }
}

function renderFuel(fuel){
  markerLayer.clearLayers();
  const rows=allData.filter(r=>r.carb===fuel);
  if(!rows.length){setStatus('ok','Aucune donnée pour '+fuel);return;}

  const prices=rows.map(r=>r.prix);
  const minP=Math.min(...prices),maxP=Math.max(...prices);
  const avgP=prices.reduce((a,b)=>a+b,0)/prices.length;

  document.getElementById('st-count').textContent=rows.length.toLocaleString('fr');
  document.getElementById('st-min').textContent=minP.toFixed(3)+' €';
  document.getElementById('st-avg').textContent=avgP.toFixed(3)+' €';
  document.getElementById('st-max').textContent=maxP.toFixed(3)+' €';
  const latest=rows.map(r=>r.maj).filter(Boolean).sort().reverse()[0];
  document.getElementById('st-date').textContent=latest?latest.slice(0,10):'—';
  document.getElementById('leg-min').textContent=minP.toFixed(2);
  document.getElementById('leg-mid').textContent=((minP+maxP)/2).toFixed(2);
  document.getElementById('leg-max').textContent=maxP.toFixed(2);
  document.getElementById('stats-panel').style.display='';
  document.getElementById('legend').style.display='';

  rows.forEach(r=>{
    const t=maxP>minP?(r.prix-minP)/(maxP-minP):0.5;
    const m=L.circleMarker([r.lat,r.lon],{
      radius:5,fillColor:colorAt(t),color:'rgba(0,0,0,.4)',
      weight:.5,opacity:1,fillOpacity:.85
    });
    m.bindPopup(`
      <div class="popup-price">${r.prix.toFixed(3)} €/L</div>
      <div class="popup-label">Carburant</div><div class="popup-val">${r.carb}</div>
      <div class="popup-label">Adresse</div><div class="popup-val">${r.adresse||'—'}, ${r.ville||'—'}</div>
      <div class="popup-label">Code postal</div><div class="popup-val">${r.cp}</div>
      <div class="popup-label">Mise à jour</div><div class="popup-val">${r.maj?r.maj.slice(0,10):'—'}</div>
    `,{maxWidth:240});
    markerLayer.addLayer(m);
  });
}

document.getElementById('fuel-buttons').addEventListener('click',e=>{
  const btn=e.target.closest('.fuel-btn');
  if(!btn)return;
  document.querySelectorAll('.fuel-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentFuel=btn.dataset.fuel;
  renderFuel(currentFuel);
});

loadData();

// ── Recherche de ville via Nominatim ──────────────────────────────
let searchTimer = null;
const searchInput = document.getElementById("search-input");
const searchSugg  = document.getElementById("search-suggestions");

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { searchSugg.classList.remove("show"); return; }
  searchTimer = setTimeout(() => fetchSuggestions(q), 350);
});

searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    clearTimeout(searchTimer);
    fetchSuggestions(searchInput.value.trim(), true);
  }
  if (e.key === "Escape") searchSugg.classList.remove("show");
});

document.getElementById("search-btn").addEventListener("click", () => {
  clearTimeout(searchTimer);
  fetchSuggestions(searchInput.value.trim(), true);
});

document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrap")) searchSugg.classList.remove("show");
});

async function fetchSuggestions(q, goFirst = false) {
  if (!q) return;
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)},France&format=json&limit=5&accept-language=fr&countrycodes=fr`;
    const res = await fetch(url, { headers: { "Accept-Language": "fr" } });
    const data = await res.json();
    if (!data.length) { searchSugg.innerHTML = '<div class="suggestion-item" style="color:var(--muted)">Aucun résultat</div>'; searchSugg.classList.add("show"); return; }
    if (goFirst) { gotoPlace(data[0]); searchSugg.classList.remove("show"); return; }
    searchSugg.innerHTML = data.map((p,i) =>
      `<div class="suggestion-item" data-idx="${i}">${p.display_name.split(",").slice(0,3).join(", ")}</div>`
    ).join("");
    searchSugg._data = data;
    searchSugg.classList.add("show");
  } catch(e) { console.error(e); }
}

searchSugg.addEventListener("click", e => {
  const item = e.target.closest(".suggestion-item");
  if (!item) return;
  const idx = parseInt(item.dataset.idx);
  gotoPlace(searchSugg._data[idx]);
  searchInput.value = searchSugg._data[idx].display_name.split(",").slice(0,2).join(", ");
  searchSugg.classList.remove("show");
});

function gotoPlace(place) {
  const lat = parseFloat(place.lat);
  const lon = parseFloat(place.lon);
  const bb  = place.boundingbox;
  if (bb) {
    map.fitBounds([[+bb[0],+bb[2]],[+bb[1],+bb[3]]], { maxZoom: 13 });
  } else {
    map.setView([lat, lon], 12);
  }
}
</script>
</body>
</html>
