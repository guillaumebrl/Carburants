name: Mise à jour données carburants

on:
  schedule:
    - cron: '0 6 * * *'   # 06h00 UTC (08h00 heure Paris été)
    - cron: '0 12 * * *'  # 12h00 UTC (14h00 heure Paris été)
  workflow_dispatch:       # permet de lancer manuellement depuis GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Télécharger les données
        run: |
          curl -o data.zip "https://donnees.roulez-eco.fr/opendata/instantane" \
            -H "User-Agent: Mozilla/5.0" \
            --retry 3 --retry-delay 5 --fail

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.zip
          git diff --cached --quiet || git commit -m "data: mise à jour $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
